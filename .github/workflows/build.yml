name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: cleaner-windows-amd64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: cleaner-linux-amd64
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            name: cleaner-macos-amd64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            name: cleaner-macos-arm64
            ext: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/cleaner${{ matrix.ext }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts for release
        run: |
          mkdir -p release
          mv artifacts/cleaner-windows-amd64/cleaner.exe release/cleaner-windows-amd64.exe
          mv artifacts/cleaner-linux-amd64/cleaner release/cleaner-linux-amd64
          mv artifacts/cleaner-macos-amd64/cleaner release/cleaner-macos-amd64
          mv artifacts/cleaner-macos-arm64/cleaner release/cleaner-macos-arm64
          chmod +x release/cleaner-*
          ls -lh release/

      - name: Get version from Cargo.toml
        run: |
          ver=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APP_VERSION=$ver" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Cleaner v${{ env.APP_VERSION }}
          files: release/*
          generate_release_notes: true
          make_latest: true
