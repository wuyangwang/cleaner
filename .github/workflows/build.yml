name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: cleaner-windows-amd64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: cleaner-linux-amd64
            ext: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: cleaner-linux-arm64
            ext: ''
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: cleaner-macos-amd64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            name: cleaner-macos-arm64
            ext: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile deps (aarch64-linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/cleaner${{ matrix.ext }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version from Cargo.toml
        run: |
          ver=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "APP_VERSION=$ver" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Cleaner v${{ env.APP_VERSION }}
          files: artifacts/**/*
          generate_release_notes: true
          make_latest: true
